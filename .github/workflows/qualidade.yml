name: Qualidade

# O laboratorio tem dezenas de demos escritas em linguagens diferentes. O que
# esta CI protege nao e o codigo de cada uma — e a promessa da pagina: se o card
# diz "no ar", tem que abrir e funcionar.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogo:
    name: Catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar catálogo
        run: node tools/build-catalog.mjs --check

      - name: Montar o site
        run: |
          node tools/build-catalog.mjs
          node tools/build-site.mjs

      # Card que promete demo sem a pasta existir e a unica mentira que esta
      # pagina pode contar. build-site.mjs corrige o status sozinho; aqui
      # conferimos que o commit ja estava coerente.
      - name: Conferir que nada ficou dessincronizado
        run: |
          if ! git diff --quiet -- site/catalog.json; then
            echo "::error::site/catalog.json esta desatualizado. Rode: node tools/build-catalog.mjs && node tools/build-site.mjs"
            git diff -- site/catalog.json
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 5

  html:
    name: HTML válido
    runs-on: ubuntu-latest
    needs: catalogo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Validar HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: dist
          css: true

  demos:
    name: As demos realmente abrem
    runs-on: ubuntu-latest
    needs: catalogo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      # Abrir cada demo marcada como "live" num navegador de verdade e o unico
      # teste que pega erro de JS, import quebrado e WASM que nao carrega.
      - name: Abrir cada demo no navegador
        run: node tools/testar-demos.mjs
