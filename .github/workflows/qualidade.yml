name: Qualidade

# O laboratorio tem dezenas de demos escritas em linguagens diferentes. O que
# esta CI protege nao e o codigo de cada uma — e a promessa da pagina: se o card
# diz "no ar", tem que abrir e funcionar.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogo:
    name: Catálogo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validar catálogo
        run: node tools/build-catalog.mjs --check

      # site/catalog.json nao e versionado: ele nasce aqui, a partir de
      # catalog/*.json, e o status de cada projeto e derivado da existencia da
      # pasta. Assim nenhum card consegue prometer uma demo que nao abre.
      - name: Montar o site
        run: |
          node tools/build-catalog.mjs
          node tools/build-site.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: site
          path: dist/
          retention-days: 5

  html:
    name: HTML válido
    runs-on: ubuntu-latest
    needs: catalogo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist

      - name: Validar HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: dist
          css: true

  demos:
    name: As demos realmente abrem
    runs-on: ubuntu-latest
    needs: catalogo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist

      # npm ci usa as versoes travadas no package-lock, para a CI testar com o
      # mesmo navegador que roda na maquina de quem desenvolve.
      - name: Instalar Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Abrir cada demo marcada como "live" num navegador de verdade e o unico
      # teste que pega erro de JS, import quebrado e WASM que nao carrega.
      - name: Abrir cada demo no navegador
        run: node tools/testar-demos.mjs

  fontes:
    name: A fonte do site principal continua lá
    runs-on: ubuntu-latest
    # As paginas do laboratorio carregam /assets/fonts/fonts.css, que mora no
    # repositorio do site principal e e servido no mesmo dominio. Reutilizar em
    # vez de duplicar aproveita o cache de quem chega vindo do portfolio — mas
    # cria uma dependencia entre dois repositorios que ninguem veria quebrar.
    # Sem este job, renomear aquele arquivo la tiraria a tipografia daqui em
    # silencio: ha fallback, entao nada quebra visivelmente, so piora.
    steps:
      - name: Conferir a folha de fontes em produção
        run: |
          alvo="https://autarktech.com.br/assets/fonts/fonts.css"
          codigo=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 "$alvo" || true)
          if [ "$codigo" != "200" ]; then
            echo "::error::$alvo respondeu HTTP $codigo. As demos perderam a tipografia do portfólio."
            exit 1
          fi
          echo "fonts.css respondendo 200." >> "$GITHUB_STEP_SUMMARY"
