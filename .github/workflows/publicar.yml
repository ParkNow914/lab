name: Publicar

# Publica dist/ no GitHub Pages. Como o site de usuario (ParkNow914.github.io)
# tem CNAME para autarktech.com.br, este repositorio aparece automaticamente em
# https://autarktech.com.br/lab/ — sem DNS novo e sem custo.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez, sem cancelar a que ja esta subindo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Construir e publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Construir
        run: |
          node tools/build-catalog.mjs
          node tools/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
